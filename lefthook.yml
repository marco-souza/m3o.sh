pre-commit:
  parallel: true
  jobs:
    - name: lint code
      run: bunx biome format --write {staged_files}
      glob: "*.{ts,tsx,js,jsx,astro,json}"
      stage_fixed: true

    - name: lint docs
      run: bunx prettier --write {staged_files}
      glob: "*.{md,mdx}"
      stage_fixed: true

    - name: format yaml
      run: bunx prettier --write {staged_files}
      glob: "*.{yml,yaml}"
      stage_fixed: true

pre-push:
  jobs:
    - name: lint check
      run: bun run lint

    - name: tests
      run: CI=true bun run test

    - name: e2e tests
      glob: "*.{ts,tsx,astro}"
      run: CI=true bun run e2e
